name: 'capstone_pipeline'
version: '1.0.0'
config-version: 2

profile: 'capstone_pipeline'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  capstone_pipeline:
    staging:
      +materialized: view
    marts:
      +materialized: table

# Module 1 — Build Your First Parameterized dbt Pipeline. Drives
# models/marts/daily_sales_summary.sql; override any of these with
# `dbt run --vars '{"target_category": "Electronics"}'` etc.
vars:
  analysis_date: '2024-01-13'
  date_range_days: 1
  order_status: completed
  target_category: All
  high_value_threshold: 300

# ---------------------------------------------------------------------------
# TODO (Module 4 — env/config-driven generation): not started. The vars:
# block above is a single static set of defaults regardless of environment.
# Ideas to implement here once Module 4 is covered:
