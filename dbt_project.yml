name: 'capstone_pipeline'
version: '1.0.0'
config-version: 2

profile: 'capstone_pipeline'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  capstone_pipeline:
    staging:
      +materialized: view
    marts:
      +materialized: table

# Module 1 — Build Your First Parameterized dbt Pipeline. Drives
# models/marts/daily_sales_summary.sql; override any of these with
# `dbt run --vars '{"target_category": "Electronics"}'` etc.
#
# Module 4 — env/config-driven generation. date_range_days and order_status
# below are target-conditioned (dev vs. prod, see profiles.yml) instead of
# one fixed default. Note the quoting: a target-conditioned var has to be a
# *quoted* Jinja string ("{{ ... }}") or YAML chokes on the bare `{{`, but
# that means it renders back as a string -- daily_sales_summary.sql coerces
# date_range_days with `| int` before doing arithmetic on it. See README
# "Module 4" section for the full explanation.
vars:
  analysis_date: '2024-01-13'
  date_range_days: "{{ 7 if target.name == 'prod' else 1 }}"
  order_status: "{{ 'completed' if target.name == 'prod' else 'pending' }}"
  target_category: All
  high_value_threshold: 300
